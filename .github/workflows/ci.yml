name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lua 5.4 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run test suite
        run: lua5.4 tests/run.lua

      - name: Check syntax
        run: |
          for file in main.lua ytlyrics/*.lua ytlyrics/providers/*.lua; do
            lua5.4 -e "assert(loadfile('$file'))" || exit 1
          done
