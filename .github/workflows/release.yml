name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          zip -r spotatui-lyrics.zip \
            main.lua ytlyrics docs README.md README.es.md LICENSE CONTRIBUTING.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: spotatui-lyrics.zip
          generate_release_notes: true
